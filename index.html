<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>השקעה ממבט ראשון</title>
    <script>
      ;(function () {
        var iOS =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        if (!iOS) return
        document.documentElement.classList.add("ios-safari")

        function offset() {
          var raw = getComputedStyle(document.documentElement).getPropertyValue("--safari-scroll-offset")
          var value = parseFloat(raw)
          return Number.isFinite(value) ? value : 0
        }

        function pin() {
          var top = offset()
          if (top <= 0) return
          if (Math.abs(window.scrollY - top) > 1) window.scrollTo(0, top)
        }

        window.addEventListener("scroll", pin, { passive: true })
        window.addEventListener("pageshow", pin)
        window.addEventListener("resize", pin)
        if (window.visualViewport) window.visualViewport.addEventListener("resize", pin)
        document.addEventListener("DOMContentLoaded", pin)
        window.addEventListener("load", pin)
        window.__pinSafariStatusBar = pin
      })()

      document.addEventListener("wheel", function (event) {
        event.preventDefault()
      }, { passive: false })
      document.addEventListener("touchmove", function (event) {
        if (event.cancelable) event.preventDefault()
      }, { passive: false })
    </script>
    <style>
      html, body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #fff;
      }

      body {
        position: fixed;
        inset: 0;
        width: 100%;
        margin: 0;
      }

      html.ios-safari {
        --safari-scroll-offset: 62px;
        height: auto;
        overflow-y: scroll;
        overscroll-behavior: none;
        background: #fff;
      }

      html.ios-safari body {
        position: static;
        inset: auto;
        width: auto;
        height: auto;
        min-height: calc(100dvh + var(--safari-scroll-offset));
        overflow: visible;
        background: #fff;
      }

      html.ios-safari .screen {
        margin-top: var(--safari-scroll-offset);
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/logo-symbol.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.__pinSafariStatusBar) window.__pinSafariStatusBar()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
