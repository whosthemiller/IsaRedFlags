<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>אנימציית טעינה · לוגו הרשות</title>
    <style>
      :root {
        --light-blue: #5cc8ed;
        --primary-blue: #3781ff;
        --light-grey: #f7f9ff;
        --deep-blue: #00113f;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--light-grey);
        color: var(--deep-blue);
        font-family: "Arial Hebrew", Arial, sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 32px 20px;
      }

      .stage {
        width: min(280px, 72vw);
      }

      .stage svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .bar {
        transform-box: view-box;
        transform: scaleY(0);
        animation: wave 4.4s infinite;
      }

      .up { transform-origin: 0 149.26px; }
      .down { transform-origin: 0 108.77px; }

      @keyframes wave {
        0% { transform: scaleY(0); animation-timing-function: cubic-bezier(0.16, 0.84, 0.32, 1); }
        14% { transform: scaleY(1); animation-timing-function: linear; }
        58% { transform: scaleY(1); animation-timing-function: cubic-bezier(0.55, 0.05, 0.7, 0.35); }
        74% { transform: scaleY(0); animation-timing-function: linear; }
        100% { transform: scaleY(0); }
      }

      p {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.01em;
        opacity: 0.72;
      }

      @media (prefers-reduced-motion: reduce) {
        .bar {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>
