<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>השקעה ממבט ראשון</title>
    <script>
      ;(function () {
        var path = location.pathname.replace(/\/+$/, "") || "/"
        if (path.endsWith("/review")) {
          document.documentElement.classList.add("review-doc")
          return
        }

        var iOS =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        if (!iOS) return
        document.documentElement.classList.add("ios-safari")

        function offset() {
          var raw = getComputedStyle(document.documentElement).getPropertyValue("--safari-scroll-offset")
          var value = parseFloat(raw)
          return Number.isFinite(value) ? value : 0
        }

        function pin() {
          var top = offset()
          if (top <= 0) return
          if (Math.abs(window.scrollY - top) > 1) window.scrollTo(0, top)
        }

        window.addEventListener("scroll", pin, { passive: true })
        window.addEventListener("pageshow", pin)
        window.addEventListener("resize", pin)
        if (window.visualViewport) window.visualViewport.addEventListener("resize", pin)
        document.addEventListener("DOMContentLoaded", pin)
        window.addEventListener("load", pin)
        window.__pinSafariStatusBar = pin
      })()

      if (!document.documentElement.classList.contains("review-doc")) {
        document.addEventListener("wheel", function (event) {
          event.preventDefault()
        }, { passive: false })
        document.addEventListener("touchmove", function (event) {
          if (event.cancelable) event.preventDefault()
        }, { passive: false })
      }
    </script>
    <style>html,body{overscroll-behavior:none;background:#fff;height:100%;overflow:hidden}body{width:100%;margin:0;position:fixed;inset:0}html.ios-safari{--safari-scroll-offset:62px;overscroll-behavior:none;background:#fff;height:auto;overflow-y:scroll}html.ios-safari body{width:auto;height:auto;min-height:calc(100dvh + var(--safari-scroll-offset));background:#fff;position:static;inset:auto;overflow:visible}html.ios-safari .screen{margin-top:var(--safari-scroll-offset)}html.review-doc,html.review-doc body,html.review-doc #root{touch-action:auto;width:auto;height:auto;max-height:none;position:static;inset:auto;overflow:auto}</style>
    <link rel="icon" href="/IsaRedFlags/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/IsaRedFlags/brand/logo-symbol.svg" />
    <script type="module" crossorigin src="/IsaRedFlags/assets/index-zFFt7vAN.js"></script>
    <link rel="stylesheet" crossorigin href="/IsaRedFlags/assets/index-3IIblu7Y.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.__pinSafariStatusBar) window.__pinSafariStatusBar()
    </script>
  </body>
</html>
